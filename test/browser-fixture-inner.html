<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; }
    #inner-nested { height: 240px; overflow-y: auto; border: 2px solid #0f766e; }
    #inner-content { height: 3000px; background: linear-gradient(#fff, #99f6e4); }
  </style>
  <script>
    (() => {
      const store = new Map();
      const listeners = [];
      const requestedKeys = [];
      let nextMenuId = 1;
      let registeredMenuCount = 0;
      const params = new URLSearchParams(location.search);
      const expectedHost = params.get('expected-host');
      const percentage = Number(params.get('percentage'));
      if (expectedHost && [70, 75, 80, 85, 90].includes(percentage)) {
        store.set(`page-scroll-percentage:site:${expectedHost}`, percentage);
      }

      window.GM_getValue = (key, defaultValue) => {
        requestedKeys.push(key);
        return store.has(key) ? store.get(key) : defaultValue;
      };
      window.GM_setValue = (key, value) => {
        const oldValue = store.get(key);
        store.set(key, value);
        listeners.forEach((entry) => {
          if (entry.key === key) entry.callback(key, oldValue, value, false);
        });
      };
      window.GM_deleteValue = (key) => {
        const oldValue = store.get(key);
        store.delete(key);
        listeners.forEach((entry) => {
          if (entry.key === key) entry.callback(key, oldValue, undefined, false);
        });
      };
      window.GM_registerMenuCommand = () => {
        registeredMenuCount += 1;
        return nextMenuId++;
      };
      window.GM_unregisterMenuCommand = () => true;
      window.GM_addValueChangeListener = (key, callback) => listeners.push({ key, callback });
      window.__innerFixture = {
        get requestedKeys() {
          return [...requestedKeys];
        },
        get registeredMenuCount() {
          return registeredMenuCount;
        },
      };
    })();
  </script>
</head>
<body>
  <div id="inner-nested" tabindex="0"><div id="inner-content">Iframe nested content</div></div>
  <script src="../better-page-up-down.user.js"></script>
</body>
</html>
